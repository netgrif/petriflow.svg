name: Publish package to GitHub Packages

on:
  release:
    types: [ published ]

permissions:
  id-token: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          check-latest: false
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - name: Build & test libraries
        run: |
          npm i --legacy-peer-deps
          cd projects/petri-svg
          npm i
          cd ../..
          npm run petrisvg:build
          npm run petrisvg:test:full
          npm i ./dist/petri-svg --save-optional --legacy-peer-deps
          npm run petriflowsvg:build
          npm run petriflowsvg:test:full
          npm i ./dist/petriflow-svg --save-optional --legacy-peer-deps
          npm run example:build:prod

  publish-npm:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: npm install -g npm@^11.5.1
      - name: Read version
        uses: zvonimirsun/read-package-version-actions@v2
        id: get_version
      - run: |
          npm i --legacy-peer-deps
          cd projects/petri-svg
          npm i
          cd ../..
      - name: Build petri.svg
        run: |
          npm run petrisvg:build
          npm i ./dist/petri-svg --save-optional --legacy-peer-deps
      - name: Publish petri.svg pre-release
        if: ${{ contains(steps.get_version.outputs.version,'-') }}
        run: |
          cd dist/petri-svg
          npm publish --access public --tag next
          cd ../..
      - name: Publish petri.svg latest
        if: ${{ !contains(steps.get_version.outputs.version,'-') }}
        run: |
          cd dist/petri-svg
          npm publish --access public --tag latest
          cd ../..
      - name: Build petriflow.svg
        run: |
          npm run petriflowsvg:build
      - name: Publish petriflow.svg pre-release
        if: ${{ contains(steps.get_version.outputs.version,'-') }}
        run: |
          cd dist/petriflow-svg
          npm publish --access public --tag next
          cd ../..
      - name: Publish petriflow.svg latest
        if: ${{ !contains(steps.get_version.outputs.version,'-') }}
        run: |
          cd dist/petriflow-svg
          npm publish --access public --tag latest

  publish-gpr:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 18
          registry-url: https://npm.pkg.github.com
      - run: npm install -g npm@^11.5.1
      - run: |
          npm i --legacy-peer-deps
          cd projects/petri-svg
          npm i
          cd ../..
      - name: Publish petri.svg
        run: |
          npm run petrisvg:build
          npm i ./dist/petri-svg --save-optional --legacy-peer-deps
          cd dist/petri-svg
          npm publish --access public
          cd ../..
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
      - name: Publish petriflow.svg
        run: |
          npm run petriflowsvg:build
          cd dist/petriflow-svg
          npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{secrets.GITHUB_TOKEN}}
